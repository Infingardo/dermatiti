<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>DermPath — Test suite</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#1e293b;margin:0;padding:24px;max-width:1100px;margin:0 auto}
    h1{font-size:1.5rem;margin:0 0 8px}
    .meta{color:#64748b;margin-bottom:16px;font-size:.875rem}
    .summary{padding:16px;border-radius:8px;margin-bottom:16px;font-weight:600}
    .summary.pass{background:#dcfce7;color:#15803d;border:2px solid #4ade80}
    .summary.fail{background:#fee2e2;color:#b91c1c;border:2px solid #f87171}
    table{width:100%;border-collapse:collapse;background:white;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:.875rem;vertical-align:top}
    th{background:#f1f5f9;color:#475569;font-weight:600;position:sticky;top:0}
    tr.pass{background:white}
    tr.fail{background:#fef2f2}
    tr.fail td:first-child{color:#b91c1c;font-weight:600}
    tr.pass td:first-child{color:#16a34a}
    .badge{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:.75rem;font-weight:600}
    .badge.pass{background:#dcfce7;color:#15803d}
    .badge.fail{background:#fee2e2;color:#b91c1c}
    code{font-family:ui-monospace,Menlo,monospace;background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:.8rem}
    .reason{color:#64748b;font-size:.8rem;margin-top:4px}
    .group{font-weight:700;background:#e2e8f0;color:#334155}
  </style>
</head>
<body>
  <h1>DermPath — Test suite</h1>
  <div class="meta">Esegue casi di regressione contro <code>engine.js</code>. Ricarica la pagina per rieseguire.</div>
  <div id="summary"></div>
  <table id="results">
    <thead><tr><th>Esito</th><th>Caso</th><th>Atteso vs ottenuto</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="engine.js"></script>
  <script src="tests/cases.js"></script>
  <script>
// I casi vivono in tests/cases.js, condivisi con il runner node (npm test).
// Prima erano scritti qui e non erano eseguibili fuori dal browser.

// Run
const tbody = document.querySelector('#results tbody');
const summary = document.querySelector('#summary');
let passed=0, failed=0, total=0;

CASES.forEach(c => {
  if(c.group) {
    const tr = document.createElement('tr');
    tr.className = 'group';
    tr.innerHTML = `<td colspan="3">${c.group}</td>`;
    tbody.appendChild(tr);
    return;
  }
  total++;
  let reason = null;
  let err = null;
  try {
    const data = {...base(), ...c.input};
    const res = Engine.calc(data);
    reason = c.check(res);
  } catch(e) {
    err = e.message;
  }
  const pass = !reason && !err;
  if(pass) passed++; else failed++;
  const tr = document.createElement('tr');
  tr.className = pass ? 'pass' : 'fail';
  tr.innerHTML = `
    <td><span class="badge ${pass?'pass':'fail'}">${pass?'✓':'✗'}</span></td>
    <td>${c.name}</td>
    <td>${pass ? '' : (err ? `<code>throw: ${err}</code>` : `<div class="reason">${reason}</div>`)}</td>
  `;
  tbody.appendChild(tr);
});

summary.className = `summary ${failed===0?'pass':'fail'}`;
summary.textContent = `${passed}/${total} test passati${failed?` — ${failed} falliti`:''}`;
  </script>
</body>
</html>
