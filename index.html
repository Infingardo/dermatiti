<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DermPath v2.14.0</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5;background:#eef2ff;color:#1e293b}
    body{min-height:100vh;padding:16px;background:linear-gradient(135deg,#eff6ff,#e0e7ff)}
    .max-w-4xl{max-width:56rem;margin:0 auto}.max-w-5xl{max-width:64rem;margin:0 auto}
    .card{background:white;border-radius:16px;box-shadow:0 10px 15px -3px rgba(0,0,0,.10);padding:24px;margin-bottom:24px}
    .flex{display:flex}.flex-1{flex:1}.items-center{align-items:center}.items-start{align-items:flex-start}.justify-between{justify-content:space-between}.gap-2{gap:.5rem}.gap-4{gap:1rem}
    .grid{display:grid}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
    @media(max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr}.flex-mobile{display:block}.scorebox{margin-top:12px}}
    .space-y-2>*+*{margin-top:.5rem}.space-y-3>*+*{margin-top:.75rem}.space-y-4>*+*{margin-top:1rem}
    .mb-1{margin-bottom:.25rem}.mb-2{margin-bottom:.5rem}.mb-3{margin-bottom:.75rem}.mb-4{margin-bottom:1rem}.mb-6{margin-bottom:1.5rem}.mt-1{margin-top:.25rem}.mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}.ml-4{margin-left:1rem}.mr-3{margin-right:.75rem}
    .p-2{padding:.5rem}.p-3{padding:.75rem}.p-4{padding:1rem}.p-6{padding:1.5rem}.px-2{padding-left:.5rem;padding-right:.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}.px-4{padding-left:1rem;padding-right:1rem}.py-1{padding-top:.25rem;padding-bottom:.25rem}.py-2{padding-top:.5rem;padding-bottom:.5rem}.py-3{padding-top:.75rem;padding-bottom:.75rem}
    .text-xs{font-size:.75rem}.text-sm{font-size:.875rem}.text-lg{font-size:1.125rem}.text-xl{font-size:1.25rem}.text-2xl{font-size:1.5rem}.text-3xl{font-size:1.875rem}
    .font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}.italic{font-style:italic}.text-center{text-align:center}.text-right{text-align:right}
    .text-white{color:#fff}.text-slate-400{color:#94a3b8}.text-slate-500{color:#64748b}.text-slate-600{color:#475569}.text-slate-700{color:#334155}.text-slate-800{color:#1e293b}
    .text-blue-700{color:#1d4ed8}.text-blue-800{color:#1e40af}.text-green-700{color:#15803d}.text-amber-700{color:#b45309}.text-red-700{color:#b91c1c}.text-purple-800{color:#6b21a8}.text-purple-900{color:#581c87}
    .bg-white{background:#fff}.bg-slate-50{background:#f8fafc}.bg-slate-100{background:#f1f5f9}.bg-slate-200{background:#e2e8f0}.bg-slate-500{background:#64748b}.bg-blue-50{background:#eff6ff}.bg-blue-600{background:#2563eb}.bg-blue-700{background:#1d4ed8}.bg-green-50{background:#f0fdf4}.bg-green-600{background:#16a34a}.bg-green-700{background:#15803d}.bg-red-50{background:#fef2f2}.bg-red-100{background:#fee2e2}.bg-amber-50{background:#fffbeb}.bg-amber-100{background:#fef3c7}.bg-purple-50{background:#faf5ff}.bg-purple-100{background:#f3e8ff}
    .border{border:1px solid}.border-2{border:2px solid}.border-4{border:4px solid}.border-l{border-left:1px solid}.border-slate-200{border-color:#e2e8f0}.border-slate-300{border-color:#cbd5e1}.border-blue-200{border-color:#bfdbfe}.border-blue-300{border-color:#93c5fd}.border-blue-500{border-color:#3b82f6}.border-blue-600{border-color:#2563eb}.border-green-400{border-color:#4ade80}.border-red-300{border-color:#fca5a5}.border-red-500{border-color:#ef4444}.border-amber-400{border-color:#fbbf24}.border-amber-500{border-color:#f59e0b}.border-purple-500{border-color:#a855f7}.border-purple-600{border-color:#9333ea}
    .rounded{border-radius:.25rem}.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}.rounded-full{border-radius:9999px}.cursor-pointer{cursor:pointer}.overflow-hidden{overflow:hidden}.shrink-0{flex-shrink:0}.block{display:block}.w-full{width:100%}.w-10{width:2.5rem}.h-1{height:.25rem}.h-10{height:2.5rem}
    select,input[type="text"],textarea{width:100%;padding:.75rem;border:2px solid #e2e8f0;border-radius:.5rem;font-size:1rem;background:white;color:#1e293b}
    select:focus,input:focus,textarea:focus{outline:none;border-color:#2563eb}
    button{font:inherit;border:0;cursor:pointer;transition:background .15s,opacity .15s}button:disabled{opacity:.5;cursor:not-allowed}
    .btn{border-radius:.5rem;font-weight:700;padding:.75rem 1rem}.btn-blue{background:#2563eb;color:white}.btn-blue:hover{background:#1d4ed8}.btn-green{background:#16a34a;color:white}.btn-green:hover{background:#15803d}.btn-slate{background:#e2e8f0;color:#334155}.btn-slate:hover{background:#cbd5e1}
    .pill{display:inline-flex;align-items:center;border-radius:9999px;padding:.2rem .55rem;font-size:.75rem;font-weight:700;background:white;border:1px solid #e2e8f0;color:#475569}
    .step-dot{width:2.5rem;height:2.5rem;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-weight:800}.step-line{height:.25rem;flex:1;margin:0 .5rem;border-radius:9999px}
    .criterion-list{padding-left:1.2rem}.criterion-list li{margin-top:.25rem}
    table{width:100%;border-collapse:collapse}th,td{padding:.5rem;text-align:left;border-bottom:1px solid #e2e8f0;font-size:.875rem}th{background:#f8fafc;color:#475569}
    @media print {
      body{background:white;padding:0}
      .no-print{display:none !important}
      .card{box-shadow:none;border:1px solid #cbd5e1;page-break-inside:avoid;margin-bottom:8px;padding:12px}
      h1{font-size:1.25rem !important}
      .scorebox{border:1px solid #94a3b8 !important;background:white !important}
      .border-2{border-width:1px !important}
      .bg-blue-50,.bg-green-50,.bg-amber-50,.bg-red-50,.bg-slate-50,.bg-amber-100,.bg-red-100,.bg-purple-50,.bg-purple-100{background:white !important}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="engine.js"></script>

  <script type="text/babel">
const {useState,useMemo,useCallback,memo} = React;

const getCompClass = (pct, blocked) => {
  if(blocked) return {label:'Non proponibile',emoji:'⛔',color:'text-red-700',bg:'bg-red-50',border:'border-red-300'};
  if(pct >= 70) return {label:'Alta',emoji:'🟢',color:'text-green-700',bg:'bg-green-50',border:'border-green-400'};
  if(pct >= 50) return {label:'Intermedia',emoji:'🟡',color:'text-amber-700',bg:'bg-amber-50',border:'border-amber-400'};
  return {label:'Bassa',emoji:'🔴',color:'text-red-700',bg:'bg-red-50',border:'border-red-300'};
};


const useForm = (init=1) => {
  const [step,setStep] = useState(init);
  return {
    step,
    next:useCallback(()=>setStep(x=>Math.min(4,x+1)),[]),
    prev:useCallback(()=>setStep(x=>Math.max(1,x-1)),[]),
    reset:useCallback(()=>setStep(init),[init])
  };
};
const useData = () => {
  const [data,setData] = useState(() => {
    try { return {...INIT,...JSON.parse(localStorage.getItem('dermpath_draft'))}; }
    catch { return INIT; }
  });
  const upd = useCallback((field,value)=>setData(prev=>{
    const next = {...prev,[field]:value};
    localStorage.setItem('dermpath_draft', JSON.stringify(next));
    return next;
  }),[]);
  const reset = useCallback(()=>{
    localStorage.removeItem('dermpath_draft');
    setData(INIT);
  },[]);
  return {data, upd, reset};
};


const Sel = memo(({label,value,onChange,opts,help}) => (
  <div>
    <label className="block font-semibold mb-2">{label}</label>
    <select value={value} onChange={e=>onChange(e.target.value)}>
      <option value="">Seleziona...</option>
      {opts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
    {help && <p className="text-xs text-slate-500 mt-1">{help}</p>}
  </div>
));

const TextArea = memo(({label,value,onChange,placeholder}) => (
  <div>
    <label className="block font-semibold mb-2">{label}</label>
    <textarea rows="3" value={value} placeholder={placeholder || ''} onChange={e=>onChange(e.target.value)} />
  </div>
));

const Chk = memo(({label,checked,onChange,help}) => (
  <label className="flex items-start p-3 border-2 border-slate-200 rounded-lg cursor-pointer">
    <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} className="mr-3 mt-1" />
    <span>
      <span className="font-medium">{label}</span>
      {help && <span className="block text-xs text-slate-500 mt-1">{help}</span>}
    </span>
  </label>
));

const TS = memo(({label,value,onChange,help}) => (
  <div className="flex items-center justify-between p-3 border-2 border-slate-200 rounded-lg">
    <span className="text-sm flex-1 mr-3">
      <span className="font-medium">{label}</span>
      {help && <span className="block text-xs text-slate-500 mt-1">{help}</span>}
    </span>
    <div className="flex rounded overflow-hidden border border-slate-300 shrink-0">
      <button type="button" onClick={()=>onChange('si')} className={`px-3 py-1 text-xs font-semibold ${value==='si'?'bg-blue-600 text-white':'bg-white text-slate-600'}`}>Sì</button>
      <button type="button" onClick={()=>onChange('no')} className={`px-3 py-1 text-xs font-semibold border-l border-slate-300 ${value==='no'?'bg-slate-500 text-white':'bg-white text-slate-600'}`}>No</button>
      <button type="button" onClick={()=>onChange('')} className={`px-3 py-1 text-xs font-semibold border-l border-slate-300 ${value===''?'bg-slate-200 text-slate-500':'bg-white text-slate-400'}`}>—</button>
    </div>
  </div>
));

const Steps = memo(({cur}) => (
  <div className="card">
    <div className="flex items-center justify-between">
      {[1,2,3,4].map(s => (
        <div key={s} className="flex items-center flex-1">
          <div className={`step-dot ${cur>=s?'bg-blue-600 text-white':'bg-slate-200 text-slate-600'}`}>{s}</div>
          {s<4 && <div className={`step-line ${cur>s?'bg-blue-600':'bg-slate-200'}`} />}
        </div>
      ))}
    </div>
  </div>
));

const Nav = memo(({onBack,onNext,canNext=true,nextLbl='Avanti →'}) => (
  <div className="flex gap-4 mt-6">
    {onBack && <button onClick={onBack} className="btn btn-slate flex-1">← Indietro</button>}
    <button onClick={onNext} disabled={!canNext} className={`btn flex-1 ${nextLbl.includes('Genera')?'btn-green':'btn-blue'}`}>{nextLbl}</button>
  </div>
));

const FlagBox = memo(({flags}) => {
  if(!flags.length) return null;
  return (
    <div className="p-4 bg-amber-100 border-2 border-amber-500 rounded-xl mb-6">
      <h3 className="text-lg font-bold text-amber-700 mb-2">Red flags morfologiche attive</h3>
      <ul className="criterion-list text-sm text-slate-800">
        {flags.map(f => <li key={f.flag}><b>{f.label}</b>: {f.diagnosi}</li>)}
      </ul>
    </div>
  );
});

const CriteriaList = ({title,items,kind}) => {
  if(!items || !items.length) return null;
  return (
    <div className="mt-3 p-3 bg-white rounded-lg border border-slate-200">
      <p className={`font-bold text-sm mb-1 ${kind==='bad'?'text-red-700':kind==='warn'?'text-amber-700':'text-slate-700'}`}>{title}</p>
      <ul className="criterion-list text-sm text-slate-700">
        {items.map((it,idx) => {
          const field = typeof it === 'string' ? it : it.field;
          const actual = typeof it === 'string' ? null : it.actual;
          return <li key={idx}>{labelize(field)}{actual !== null && actual !== undefined ? `: ${actual}` : ''}</li>;
        })}
      </ul>
    </div>
  );
};

const DxCard = memo(({dx,idx,considered=false}) => {
  const isLymph = dx.cat.includes('Linfoma');
  const cls = getCompClass(dx.pct, dx.blocked);
  const border = isLymph ? 'border-red-500 bg-red-50' : considered ? 'border-slate-300 bg-slate-50' : 'border-blue-500 bg-blue-50';
  return (
    <div className={`${border} border-2 rounded-xl p-4 mb-4`}>
      <div className="flex flex-mobile justify-between items-start mb-2">
        <div>
          <span className="pill">#{idx+1} · {dx.cat}</span>
          <h3 className="text-xl font-bold mt-2">{dx.nome}</h3>
        </div>
        <div className={`scorebox text-right ml-4 px-3 py-2 rounded-lg ${cls.bg} ${cls.border} border-2`}>
          <div className={`text-lg font-bold ${cls.color}`}>{cls.emoji} {cls.label}</div>
          <div className="text-xs text-slate-500 mt-1">compatibilità corretta: {dx.pct}%</div>
          <div className="text-xs text-slate-500">grezza: {dx.compatibility}% · completezza: {dx.completeness}%</div>
        </div>
      </div>
      <p className="text-sm mb-3 bg-white rounded-lg p-3 border border-slate-200">{dx.note}</p>
      <CriteriaList title="Criteri presenti" items={dx.matched} />
      <CriteriaList title="Required mancanti" items={dx.missingRequired} kind="warn" />
      <CriteriaList title="Required contrari/non coerenti" items={dx.failedRequired} kind="bad" />
      <CriteriaList title="Elementi contro" items={dx.againstHits} kind="bad" />
      {dx.excludedByFlags.length > 0 && (
        <div className="mt-3 p-3 bg-red-100 rounded-lg border border-red-300">
          <p className="font-bold text-sm text-red-700 mb-1">Penalizzata da red flag</p>
          <ul className="criterion-list text-sm text-red-700">
            {dx.excludedByFlags.map(f => <li key={f.flag}>{f.label}</li>)}
          </ul>
        </div>
      )}
      {dx.workup && dx.workup.length > 0 && (
        <div className="mt-3 p-3 bg-amber-50 rounded-lg border border-amber-500">
          <p className="font-bold text-sm text-amber-700 mb-1">Cosa serve per chiudere / controllare</p>
          <ul className="criterion-list text-sm text-slate-700">
            {dx.workup.map((w,i) => <li key={i}>{w}</li>)}
          </ul>
        </div>
      )}
    </div>
  );
});

const Step1 = memo(({data,upd,onNext}) => (
  <div>
    <h2 className="text-2xl font-bold mb-2">1. Pattern primario</h2>
    <p className="text-sm text-slate-600 mb-4">Seleziona il pattern dominante. I pattern non ancora implementati verranno segnalati come tali, senza inventare diagnosi o diagnosi "da considerare" generate per inerzia.</p>
    <div className="space-y-3">
      {PATTERNS.map(o => {
        const supported = Object.values(DX).some(dx => {
          const exp = dx.major?.pattern_primario;
          return Array.isArray(exp) ? exp.includes(o.value) : exp === o.value;
        });
        return (
          <label key={o.value} className={`flex items-start p-4 border-2 rounded-lg cursor-pointer ${data.pattern_primario===o.value?'border-blue-600 bg-blue-50':'border-slate-200 bg-white'}`}>
            <input type="radio" value={o.value} checked={data.pattern_primario===o.value} onChange={()=>upd('pattern_primario',o.value)} className="mt-1 mr-3" />
            <div>
              <div className="font-semibold">{o.label} {!supported && <span className="pill ml-4">modulo non implementato</span>}</div>
              <div className="text-sm text-slate-600">{o.desc}</div>
            </div>
          </label>
        );
      })}
    </div>
    <Nav onNext={onNext} canNext={!!data.pattern_primario} />
  </div>
));

const Step2 = memo(({data,upd,onBack,onNext}) => (
  <div>
    <h2 className="text-2xl font-bold mb-2">2. Epidermide</h2>
    <p className="text-sm text-slate-600 mb-4">Le checkbox sono clue positivi: se non selezionate vengono trattate come non documentate, non come assenze provate.</p>
    <div className="grid grid-2">
      <Sel label="Spongiosi" value={data.spongiosi} onChange={v=>upd('spongiosi',v)} opts={['assente','lieve','moderata','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Esocitosi" value={data.esocitosi} onChange={v=>upd('esocitosi',v)} opts={['assente','lieve','presente','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Acantosi" value={data.acantosi} onChange={v=>upd('acantosi',v)} opts={['assente','lieve','moderata','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Paracheratosi" value={data.paracheratosi} onChange={v=>upd('paracheratosi',v)} opts={['assente','focale','moderata','marcata'].map(v=>({value:v,label:v}))} />
      <TS label="Ipogranulosi" value={data.ipogranulosi} onChange={v=>upd('ipogranulosi',v)} />
      <TS label="Ipergranulosi" value={data.ipergranulosi} onChange={v=>upd('ipergranulosi',v)} />
      <Sel label="Vacuolizzazione basale" value={data.vacuolizzazione_basale} onChange={v=>upd('vacuolizzazione_basale',v)} opts={['assente','presente','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Necrosi cheratinocitaria" value={data.necrosi_keratinociti} onChange={v=>upd('necrosi_keratinociti',v)} opts={['assente','presente','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Neutrofili" value={data.neutrofili} onChange={v=>upd('neutrofili',v)} opts={['assenti','rari','presenti','abbondanti'].map(v=>({value:v,label:v}))} />
      <TS label="Microascessi di Munro" value={data.microascessi_munro} onChange={v=>upd('microascessi_munro',v)} />
      <TS label="Corpi di Civatte" value={data.corpi_civatte} onChange={v=>upd('corpi_civatte',v)} />
      <Chk label="Saw-toothing" checked={data.saw_toothing} onChange={v=>upd('saw_toothing',v)} />
      <Chk label="Assottigliamento sovrapapillare" checked={data.assottigliamento_soprapapillare} onChange={v=>upd('assottigliamento_soprapapillare',v)} />
      <Chk label="Capillari dilatati nelle papille" checked={data.capillari_dilatati_papille} onChange={v=>upd('capillari_dilatati_papille',v)} />
      <TS label="Atrofia epidermica" value={data.atrofia_epidermica} onChange={v=>upd('atrofia_epidermica',v)} help="Assottigliamento dell'epidermide con perdita delle creste. Suggestivo di lupus discoide cronico." />
      <TS label="Ispessimento BMZ (membrana basale)" value={data.ispessimento_bmz} onChange={v=>upd('ispessimento_bmz',v)} help="Membrana basale ispessita, PAS-positiva. Caratteristica del lupus discoide." />
      <Sel label="Sede della bolla" value={data.sede_bolla} onChange={v=>upd('sede_bolla',v)} opts={[
        {value:'subcornea',label:'Subcornea'},
        {value:'intraepidermica',label:'Intraepidermica (soprabasale)'},
        {value:'subepidermica',label:'Subepidermica (sottoepidermica)'}
      ]} help="Localizzazione della separazione: dirimente per il differenziale tra pemfigo (intraepidermica) e pemfigoide (subepidermica)." />
      <TS label="Acantolisi" value={data.acantolisi} onChange={v=>upd('acantolisi',v)} help="Perdita di adesione tra cheratinociti. Cardine del pemfigo." />
    </div>
    <Nav onBack={onBack} onNext={onNext} />
  </div>
));

const Step3 = memo(({data,upd,onBack,onNext}) => (
  <div>
    <h2 className="text-2xl font-bold mb-4">3. Derma e infiltrato</h2>
    <div className="grid grid-2">
      <Sel label="Distribuzione infiltrato" value={data.infiltrato_distribuzione} onChange={v=>upd('infiltrato_distribuzione',v)} opts={[
        {value:'perivascolare_superficiale',label:'Perivascolare superficiale'},
        {value:'perivascolare_profondo',label:'Perivascolare profondo'},
        {value:'banda_lichenoide',label:'Banda lichenoide'},
        {value:'perianessiale',label:'Perianessiale'},
        {value:'interstiziale',label:'Interstiziale'}
      ]} />
      <Sel label="Densità infiltrato" value={data.infiltrato_densita} onChange={v=>upd('infiltrato_densita',v)} opts={['assente','lieve','moderata','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Eosinofili" value={data.eosinofili} onChange={v=>upd('eosinofili',v)} opts={['assenti','rari','presenti','abbondanti'].map(v=>({value:v,label:v}))} />
      <Sel label="Plasmacellule" value={data.plasmacellule} onChange={v=>upd('plasmacellule',v)} opts={[
        {value:'assenti',label:'Assenti'},
        {value:'presenti',label:'Presenti: pensare anche a sifilide'},
        {value:'abbondanti',label:'Abbondanti: sifilide da escludere'}
      ]} />
      <Sel label="Linfociti atipici" value={data.linfociti_atipici} onChange={v=>upd('linfociti_atipici',v)} opts={['assenti','rari','presenti','abbondanti'].map(v=>({value:v,label:v}))} />
      <Sel label="Epidermotropismo" value={data.epidermotropismo} onChange={v=>{
        upd('epidermotropismo',v);
        if(!['presente','marcato'].includes(v)){
          upd('spongiosi_proporzionata','');
          upd('alone_chiaro','');
        }
      }} opts={['assente','presente','marcato'].map(v=>({value:v,label:v}))} help="Scala coerente con il motore: assente/presente/marcato. I campi dipendenti vengono azzerati se assente/vuoto." />
      {['presente','marcato'].includes(data.epidermotropismo) && (
        <>
          <TS label="Spongiosi proporzionata all'epidermotropismo?" value={data.spongiosi_proporzionata} onChange={v=>upd('spongiosi_proporzionata',v)} help="Sì = dermatite più probabile; No = possibile MF se gli altri criteri reggono." />
          <TS label="Alone chiaro attorno ai linfociti epidermotropi" value={data.alone_chiaro} onChange={v=>upd('alone_chiaro',v)} />
        </>
      )}
      <TS label="Mucina dermica" value={data.mucina_dermica} onChange={v=>upd('mucina_dermica',v)} help="Mucina interstiziale nel derma reticolare (Alcian/colloidal iron). Caratteristica di lupus e granuloma anulare." />
      <TS label="Infiltrato anche perianessiale" value={data.infiltrato_perianessiale} onChange={v=>upd('infiltrato_perianessiale',v)} help="Componente perianessiale aggiuntiva (oltre al pattern perivascolare). Suggestiva di lupus." />
      <TS label="Necrosi fibrinoide vasale" value={data.necrosi_fibrinoide} onChange={v=>upd('necrosi_fibrinoide',v)} help="Necrosi della parete dei piccoli vasi del derma (eosinofila, fibrinosa). Cardine della vasculite." />
      <TS label="Leucocitoclasia" value={data.leucocitoclasia} onChange={v=>upd('leucocitoclasia',v)} help="Frammenti nucleari di neutrofili (nuclear dust) attorno e dentro le pareti vasali." />
      <TS label="Eritrociti extravasati nel derma" value={data.eritrociti_extravasati_dermici} onChange={v=>upd('eritrociti_extravasati_dermici',v)} help="Stravaso emorragico dermico. Comune in vasculiti e vasculopatie." />
      <Sel label="Tipo di granuloma" value={data.tipo_granuloma} onChange={v=>upd('tipo_granuloma',v)} opts={[
        {value:'sarcoide_like',label:'Sarcoide-like (nudo, non caseoso)'},
        {value:'a_palizzata',label:'A palizzata (con necrobiosi al centro)'},
        {value:'tubercolare_caseoso',label:'Tubercolare/caseoso'},
        {value:'corpi_estranei',label:'Da corpi estranei'},
        {value:'suppurativo',label:'Suppurativo'}
      ]} help="Compilare solo se pattern granulomatoso o granulomatoso a palizzata." />
      <TS label="Necrobiosi" value={data.necrobiosi} onChange={v=>upd('necrobiosi',v)} help="Degenerazione del collagene al centro del granuloma a palizzata. Presente in GA e NL, assente in sarcoide." />
    </div>
    <Nav onBack={onBack} onNext={onNext} />
  </div>
));

const Step4 = memo(({data,upd,onBack,onGen}) => (
  <div>
    <h2 className="text-2xl font-bold mb-4">4. Controlli finali</h2>
    <div className="space-y-4">
      <div className="grid grid-2">
        <Chk label="Necrosi cheratinocitaria diffusa" checked={data.necrosi_cheratinociti_diffusa} onChange={v=>upd('necrosi_cheratinociti_diffusa',v)} />
        <Chk label="Eritrociti intraepidermici" checked={data.eritrociti_extravasati_intraepidermici} onChange={v=>upd('eritrociti_extravasati_intraepidermici',v)} />
      </div>
      <div className="grid grid-2">
        <div>
          <label className="block font-semibold mb-2">Sede anatomica</label>
          <input type="text" value={data.sede_anatomica} placeholder="es. tronco, arto, cuoio capelluto..." onChange={e=>upd('sede_anatomica',e.target.value)} />
        </div>
        <TextArea label="Note cliniche" value={data.note_cliniche} onChange={v=>upd('note_cliniche',v)} placeholder="durata, recidiva, farmaci, lesioni multiple, distribuzione..." />
      </div>
    </div>
    <Nav onBack={onBack} onNext={onGen} nextLbl="🔬 Genera valutazione" />
  </div>
));

const App = () => {
  const {step,next,prev,reset:resetStep} = useForm(1);
  const {data,upd,reset:resetData} = useData();
  const [showRes,setShowRes] = useState(false);
  const [res,setRes] = useState({diagnoses:[],considered:[],allScores:[],flags:[],unsupportedPattern:false});

  const handleReset = useCallback(() => {
    if(confirm('Reset completo?')){
      resetData(); resetStep(); setShowRes(false);
    }
  },[resetData,resetStep]);

  const handleCalc = useCallback(() => {
    setRes(Engine.calc(data));
    setShowRes(true);
  },[data]);

  const renderStep = () => {
    switch(step){
      case 1: return <Step1 data={data} upd={upd} onNext={next} />;
      case 2: return <Step2 data={data} upd={upd} onBack={prev} onNext={next} />;
      case 3: return <Step3 data={data} upd={upd} onBack={prev} onNext={next} />;
      case 4: return <Step4 data={data} upd={upd} onBack={prev} onGen={handleCalc} />;
      default: return null;
    }
  };

  return (
    <div className="max-w-5xl">
      <div className="card">
        <div className="flex flex-mobile items-center justify-between">
          <div>
            <h1 className="text-3xl font-bold text-slate-800">🔬 DermPath v2.14.0</h1>
            <p className="text-sm text-slate-600 mt-1">Come usarlo: scegli il pattern, compila solo i reperti osservati, poi genera una valutazione. Se il pattern non è implementato, il prototipo deve fermarsi senza suggerire diagnosi.</p>
          </div>
          <button onClick={handleReset} className="btn btn-slate mt-3 no-print">Reset</button>
        </div>
      </div>

      {!showRes && <Steps cur={step} />}

      {!showRes ? (
        <div className="card">{renderStep()}</div>
      ) : (
        <div className="card">
          <h2 className="text-2xl font-bold mb-4">Valutazione morfologica</h2>
          <FlagBox flags={res.flags} />

          {res.unsupportedPattern && (
            <div className="p-6 bg-slate-50 border-2 border-slate-300 rounded-xl mb-6">
              <p className="font-bold text-slate-700 text-center">Pattern riconosciuto, ma modulo diagnostico non ancora implementato.</p>
              <p className="text-sm text-slate-600 mt-2 text-center">Cosa fare: non usare il ranking per questo caso; descrivi il pattern e integra con clinica, colorazioni/IHC e diagnosi differenziale esterna al prototipo.</p>
              <p className="text-sm text-slate-600 mt-2 text-center">Meglio nessuna diagnosi che una diagnosi o una lista “da considerare” generate per inerzia.</p>
            </div>
          )}

          {res.diagnoses.length > 0 ? (
            <div className="mb-6">
              <h3 className="text-xl font-bold mb-3">Diagnosi proponibili</h3>
              {res.diagnoses.map((dx,i) => <DxCard key={dx.key} dx={dx} idx={i} />)}
            </div>
          ) : (
            <div className="p-6 bg-slate-50 border-2 border-slate-300 rounded-xl mb-6 text-center">
              <p className="font-bold text-slate-700">Nessuna diagnosi proponibile con i dati inseriti.</p>
              <p className="text-sm text-slate-600 mt-2">Required mancanti o dati insufficienti (servono almeno 2 major o equivalente).</p>
            </div>
          )}

          {res.considered.length > 0 && (
            <div className="mb-6">
              <h3 className="text-xl font-bold mb-3">Diagnosi da considerare, non chiudibili</h3>
              {res.considered.map((dx,i) => <DxCard key={dx.key} dx={dx} idx={i} considered />)}
            </div>
          )}

          <div className="p-4 bg-blue-50 border-2 border-blue-200 rounded-xl mb-6">
            <h3 className="text-lg font-bold text-blue-800 mb-2">Nota interpretativa</h3>
            <p className="text-sm text-slate-700">La percentuale è una compatibilità euristica corretta per completezza, required mancanti, elementi contro e red flags. Non è una probabilità diagnostica.</p>
            <p className="text-sm text-slate-700 mt-2"><b>Cosa fare:</b> usa l'elenco come promemoria dei criteri da verificare, non come referto automatico; se required, red flag o pattern non implementati bloccano il risultato, fermati e documenta il limite.</p>
          </div>

          <div className="flex gap-4 no-print">
            <button onClick={()=>setShowRes(false)} className="btn btn-slate flex-1">← Modifica dati</button>
            <button onClick={()=>{
              const txt = buildExportText(data,res);
              navigator.clipboard.writeText(txt).then(()=>alert('Testo copiato negli appunti.')).catch(()=>{
                const w=window.open('','_blank');
                w.document.write('<pre style="font-family:monospace;padding:16px;white-space:pre-wrap">'+txt.replace(/</g,'&lt;')+'</pre>');
                w.document.close();
              });
            }} className="btn btn-slate flex-1">📋 Copia referto</button>
            <button onClick={()=>window.print()} className="btn btn-slate flex-1">🖨️ Stampa / PDF</button>
          </div>
        </div>
      )}
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
