// FIX 1: MIN_ANSWERED_WEIGHT 4→6, MIN_CRITERIA_FOR_HIGH 2→3
// Motivazione: con MIN=4 bastava 1 major + 1 minor per sbloccare (2 criteri).
// Con 6 servono almeno 2 major (6) oppure 1 major + 3 minor (6).
// MIN_CRITERIA_FOR_HIGH=3: almeno 3 criteri matched, non 2.
const SC = {
  MAJOR: 3,
  MINOR: 1,
  THRESH: 50,
  MIN_CRITERIA_FOR_HIGH: 3,
  MIN_ANSWERED_WEIGHT: 6,
  RED_PENALTY: 25,
  REQUIRED_CAP: 49,
  LOW_DATA_CAP: 49,
  AGAINST_PENALTY: 12
};

const ORD = {
  epidermotropismo:['assente','presente','marcato'],

  necrosi_keratinociti:['assente','presente','marcata'],
  plasmacellule:['assenti','presenti','abbondanti'],
  spongiosi:['assente','lieve','moderata','marcata'],

  paracheratosi:['assente','focale','moderata','marcata'],
  infiltrato_densita:['assente','lieve','moderata','marcata']

const EXACT_ARRAY_FIELDS = new Set(['spongiosi','paracheratosi','neutrofili']);
const isMissing = (v) => v === '' || v === null || v === undefined;

const labelize = (field) => ({
  pattern_primario:'pattern primario',
  spongiosi:'spongiosi',
  esocitosi:'esocitosi',
  acantosi:'acantosi',
  paracheratosi:'paracheratosi',
  ipogranulosi:'ipogranulosi',
  ipergranulosi:'ipergranulosi',
  vacuolizzazione_basale:'vacuolizzazione basale',
  necrosi_keratinociti:'necrosi cheratinocitaria',
  infiltrato_distribuzione:'distribuzione infiltrato',
  eosinofili:'eosinofili',
  neutrofili:'neutrofili',
  plasmacellule:'plasmacellule',
  linfociti_atipici:'linfociti atipici',
  epidermotropismo:'epidermotropismo',
  spongiosi_proporzionata:'spongiosi proporzionata',
  alone_chiaro:'alone chiaro',
  microascessi_munro:'microascessi di Munro',
  corpi_civatte:'corpi di Civatte',
  saw_toothing:'saw-toothing',
  assottigliamento_soprapapillare:'assottigliamento sovrapapillare',
  capillari_dilatati_papille:'capillari dilatati nelle papille'
}[field] || field.replaceAll('_',' '));

const matchAtLeast = (field, expected, actual) => {
  const rank = ORD[field];
  if(!rank) return actual === expected;
  const eIdx = rank.indexOf(expected);
  const aIdx = rank.indexOf(actual);
  if(eIdx < 0 || aIdx < 0) return actual === expected;
  return aIdx >= eIdx;
};

const matches = (field, expected, actual) => {
  if(typeof expected === 'boolean') return actual === expected;
  if(Array.isArray(expected)){
    if(EXACT_ARRAY_FIELDS.has(field)) return expected.includes(actual);
    return expected.some(e => matchAtLeast(field,e,actual));
  }
  return matchAtLeast(field,expected,actual);
};

const getCompClass = (pct, blocked) => {
  if(blocked) return {label:'Non proponibile',emoji:'⛔',color:'text-red-700',bg:'bg-red-50',border:'border-red-300'};
  if(pct >= 70) return {label:'Alta',emoji:'🟢',color:'text-green-700',bg:'bg-green-50',border:'border-green-400'};
  if(pct >= 50) return {label:'Intermedia',emoji:'🟡',color:'text-amber-700',bg:'bg-amber-50',border:'border-amber-400'};
  return {label:'Bassa',emoji:'🔴',color:'text-red-700',bg:'bg-red-50',border:'border-red-300'};
};

const findCriterionExpected = (dx, field) => {
  if(dx.major && Object.prototype.hasOwnProperty.call(dx.major,field)) return dx.major[field];
  if(dx.minor && Object.prototype.hasOwnProperty.call(dx.minor,field)) return dx.minor[field];
  return undefined;
};

const Engine = {
  scoreDx:(key,dx,d,flags) => {
    let raw = 0, answeredWeight = 0, totalWeight = 0, matchedCriteria = 0;
    const matched = [], unmatched = [], missing = [], missingRequired = [], failedRequired = [], againstHits = [];

    const addCrit = (field, expected, weight, tier) => {
      totalWeight += weight;
      const actual = d[field];
      if(isMissing(actual)){
        missing.push(field);
        return;
      }
      answeredWeight += weight;
      const hit = matches(field, expected, actual);
      if(hit){
        raw += weight;
        matchedCriteria += 1;
        matched.push({field, expected, actual, tier});
      }else{
        unmatched.push({field, expected, actual, tier});
      }
    };

    Object.entries(dx.major || {}).forEach(([f,e]) => addCrit(f,e,SC.MAJOR,'major'));
    Object.entries(dx.minor || {}).forEach(([f,e]) => addCrit(f,e,SC.MINOR,'minor'));

    (dx.required || []).forEach(field => {
      const actual = d[field];
      const expected = findCriterionExpected(dx,field);
      if(isMissing(actual)) missingRequired.push(field);
      else if(expected !== undefined && !matches(field,expected,actual)) failedRequired.push(field);
    });

    Object.entries(dx.against || {}).forEach(([field,expected]) => {
      const actual = d[field];
      if(!isMissing(actual) && matches(field,expected,actual)) againstHits.push({field,expected,actual});
    });

    const compatibility = answeredWeight > 0 ? Math.round((raw / answeredWeight) * 100) : 0;
    const completeness = totalWeight > 0 ? Math.round((answeredWeight / totalWeight) * 100) : 0;
    const excludedByFlags = flags.filter(rf => rf.escludi.includes(key));

    let pct = compatibility;
    const lowData = answeredWeight < SC.MIN_ANSWERED_WEIGHT || matchedCriteria < SC.MIN_CRITERIA_FOR_HIGH;
    const requiredProblem = missingRequired.length > 0 || failedRequired.length > 0;

    if(lowData) pct = Math.min(pct,SC.LOW_DATA_CAP);
    if(requiredProblem) pct = Math.min(pct,SC.REQUIRED_CAP);
    if(againstHits.length) pct = Math.max(0,pct - againstHits.length * SC.AGAINST_PENALTY);
    if(excludedByFlags.length) pct = Math.max(5,pct - SC.RED_PENALTY);

    const blocked = pct < SC.THRESH || lowData || requiredProblem || excludedByFlags.length > 0;

    return {
      key,...dx,
      pct, compatibility, completeness, answeredWeight, totalWeight, matchedCriteria,
      matched, unmatched, missing, missingRequired, failedRequired, againstHits, excludedByFlags,
      lowData, requiredProblem, blocked
    };
  },
  calc:(d) => {
    const flags = RED_FLAGS.filter(rf => rf.test(d));
    const scores = Object.entries(DX).map(([key,dx]) => Engine.scoreDx(key,dx,d,flags)).sort((a,b)=>b.pct-a.pct);
    const diagnoses = scores.filter(x => x.pct >= SC.THRESH && !x.blocked);
    const considered = scores.filter(x => x.pct > 0 && !diagnoses.includes(x)).slice(0,5);
    const unsupportedPattern = d.pattern_primario && !scores.some(x => x.compatibility > 0);
    return {diagnoses, considered, allScores:scores, flags, unsupportedPattern};
  }
};

const useForm = (init=1) => {
  const [step,setStep] = useState(init);
  return {
    step,
    next:useCallback(()=>setStep(x=>Math.min(4,x+1)),[]),
    prev:useCallback(()=>setStep(x=>Math.max(1,x-1)),[]),
    reset:useCallback(()=>setStep(init),[init])
  };
};
const useData = () => {
  const [data,setData] = useState(INIT);
  return {
    data,
    upd:useCallback((field,value)=>setData(prev=>({...prev,[field]:value})),[]),
    reset:useCallback(()=>setData(INIT),[])
  };
};

    <select value={value} onChange={e=>onChange(e.target.value)}>
      <option value="">Seleziona...</option>
      {opts.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
    {help && <p className="text-xs text-slate-500 mt-1">{help}</p>}
  </div>
));

const TextArea = memo(({label,value,onChange,placeholder}) => (
  <div>
    <label className="block font-semibold mb-2">{label}</label>
    <textarea rows="3" value={value} placeholder={placeholder || ''} onChange={e=>onChange(e.target.value)} />
  </div>
));

const Chk = memo(({label,checked,onChange,help}) => (
  <label className="flex items-start p-3 border-2 border-slate-200 rounded-lg cursor-pointer">
    <input type="checkbox" checked={checked} onChange={e=>onChange(e.target.checked)} className="mr-3 mt-1" />
    <span>
      <span className="font-medium">{label}</span>
      {help && <span className="block text-xs text-slate-500 mt-1">{help}</span>}
    </span>
  </label>
));

const TS = memo(({label,value,onChange,help}) => (
  <div className="flex items-center justify-between p-3 border-2 border-slate-200 rounded-lg">
    <span className="text-sm flex-1 mr-3">
      <span className="font-medium">{label}</span>
      {help && <span className="block text-xs text-slate-500 mt-1">{help}</span>}
    </span>
    <div className="flex rounded overflow-hidden border border-slate-300 shrink-0">
      <button type="button" onClick={()=>onChange('si')} className={`px-3 py-1 text-xs font-semibold ${value==='si'?'bg-blue-600 text-white':'bg-white text-slate-600'}`}>Sì</button>
      <button type="button" onClick={()=>onChange('no')} className={`px-3 py-1 text-xs font-semibold border-l border-slate-300 ${value==='no'?'bg-slate-500 text-white':'bg-white text-slate-600'}`}>No</button>
      <button type="button" onClick={()=>onChange('')} className={`px-3 py-1 text-xs font-semibold border-l border-slate-300 ${value===''?'bg-slate-200 text-slate-500':'bg-white text-slate-400'}`}>—</button>
    </div>
  </div>
));

const Steps = memo(({cur}) => (
  <div className="card">
    <div className="flex items-center justify-between">
      {[1,2,3,4].map(s => (
        <div key={s} className="flex items-center flex-1">
          <div className={`step-dot ${cur>=s?'bg-blue-600 text-white':'bg-slate-200 text-slate-600'}`}>{s}</div>
          {s<4 && <div className={`step-line ${cur>s?'bg-blue-600':'bg-slate-200'}`} />}
        </div>
      ))}
    </div>
  </div>
));

const Nav = memo(({onBack,onNext,canNext=true,nextLbl='Avanti →'}) => (
  <div className="flex gap-4 mt-6">
    {onBack && <button onClick={onBack} className="btn btn-slate flex-1">← Indietro</button>}
    <button onClick={onNext} disabled={!canNext} className={`btn flex-1 ${nextLbl.includes('Genera')?'btn-green':'btn-blue'}`}>{nextLbl}</button>
  </div>
));

const FlagBox = memo(({flags}) => {
  if(!flags.length) return null;
  return (
    <div className="p-4 bg-amber-100 border-2 border-amber-500 rounded-xl mb-6">
      <h3 className="text-lg font-bold text-amber-700 mb-2">Red flags morfologiche attive</h3>
      <ul className="criterion-list text-sm text-slate-800">
        {flags.map(f => <li key={f.flag}><b>{f.label}</b>: {f.diagnosi}</li>)}
      </ul>
    </div>
  );
});

const CriteriaList = ({title,items,kind}) => {
  if(!items || !items.length) return null;
  return (
    <div className="mt-3 p-3 bg-white rounded-lg border border-slate-200">
      <p className={`font-bold text-sm mb-1 ${kind==='bad'?'text-red-700':kind==='warn'?'text-amber-700':'text-slate-700'}`}>{title}</p>
      <ul className="criterion-list text-sm text-slate-700">
        {items.map((it,idx) => {
          const field = typeof it === 'string' ? it : it.field;
          const actual = typeof it === 'string' ? null : it.actual;
          return <li key={idx}>{labelize(field)}{actual !== null && actual !== undefined ? `: ${actual}` : ''}</li>;
        })}
      </ul>
    </div>
  );
};

const DxCard = memo(({dx,idx,considered=false}) => {
  const isLymph = dx.cat.includes('Linfoma');
  const cls = getCompClass(dx.pct, dx.blocked);
  const border = isLymph ? 'border-red-500 bg-red-50' : considered ? 'border-slate-300 bg-slate-50' : 'border-blue-500 bg-blue-50';
  return (
    <div className={`${border} border-2 rounded-xl p-4 mb-4`}>
      <div className="flex flex-mobile justify-between items-start mb-2">
        <div>
          <span className="pill">#{idx+1} · {dx.cat}</span>
          <h3 className="text-xl font-bold mt-2">{dx.nome}</h3>
        </div>
        <div className={`scorebox text-right ml-4 px-3 py-2 rounded-lg ${cls.bg} ${cls.border} border-2`}>
          <div className={`text-lg font-bold ${cls.color}`}>{cls.emoji} {cls.label}</div>
          <div className="text-xs text-slate-500 mt-1">compatibilità corretta: {dx.pct}%</div>
          <div className="text-xs text-slate-500">grezza: {dx.compatibility}% · completezza: {dx.completeness}%</div>
        </div>
      </div>
      <p className="text-sm mb-3 bg-white rounded-lg p-3 border border-slate-200">{dx.note}</p>
      <CriteriaList title="Criteri presenti" items={dx.matched} />
      <CriteriaList title="Required mancanti" items={dx.missingRequired} kind="warn" />
      <CriteriaList title="Required contrari/non coerenti" items={dx.failedRequired} kind="bad" />
      <CriteriaList title="Elementi contro" items={dx.againstHits} kind="bad" />
      {dx.excludedByFlags.length > 0 && (
        <div className="mt-3 p-3 bg-red-100 rounded-lg border border-red-300">
          <p className="font-bold text-sm text-red-700 mb-1">Penalizzata da red flag</p>
          <ul className="criterion-list text-sm text-red-700">
            {dx.excludedByFlags.map(f => <li key={f.flag}>{f.label}</li>)}
          </ul>
        </div>
      )}
      {dx.workup && dx.workup.length > 0 && (
        <div className="mt-3 p-3 bg-amber-50 rounded-lg border border-amber-500">
          <p className="font-bold text-sm text-amber-700 mb-1">Cosa serve per chiudere / controllare</p>
          <ul className="criterion-list text-sm text-slate-700">
            {dx.workup.map((w,i) => <li key={i}>{w}</li>)}
          </ul>
        </div>
      )}
    </div>
  );
});

const Step1 = memo(({data,upd,onNext}) => (
  <div>
    <h2 className="text-2xl font-bold mb-2">1. Pattern primario</h2>
    <p className="text-sm text-slate-600 mb-4">Seleziona il pattern dominante. I pattern non ancora implementati verranno segnalati come tali, senza inventare diagnosi.</p>
    <div className="space-y-3">
      {PATTERNS.map(o => {
        const supported = Object.values(DX).some(dx => {
          const exp = dx.major?.pattern_primario;
          return Array.isArray(exp) ? exp.includes(o.value) : exp === o.value;
        });
        return (
          <label key={o.value} className={`flex items-start p-4 border-2 rounded-lg cursor-pointer ${data.pattern_primario===o.value?'border-blue-600 bg-blue-50':'border-slate-200 bg-white'}`}>
            <input type="radio" value={o.value} checked={data.pattern_primario===o.value} onChange={()=>upd('pattern_primario',o.value)} className="mt-1 mr-3" />
            <div>
              <div className="font-semibold">{o.label} {!supported && <span className="pill ml-4">modulo non implementato</span>}</div>
              <div className="text-sm text-slate-600">{o.desc}</div>
            </div>
          </label>
        );
      })}
    </div>
    <Nav onNext={onNext} canNext={!!data.pattern_primario} />
  </div>
));

const Step2 = memo(({data,upd,onBack,onNext}) => (
  <div>
    <h2 className="text-2xl font-bold mb-4">2. Epidermide</h2>
    <div className="grid grid-2">
      <Sel label="Spongiosi" value={data.spongiosi} onChange={v=>upd('spongiosi',v)} opts={['assente','lieve','moderata','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Esocitosi" value={data.esocitosi} onChange={v=>upd('esocitosi',v)} opts={['assente','lieve','presente','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Acantosi" value={data.acantosi} onChange={v=>upd('acantosi',v)} opts={['assente','lieve','moderata','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Paracheratosi" value={data.paracheratosi} onChange={v=>upd('paracheratosi',v)} opts={['assente','focale','moderata','marcata'].map(v=>({value:v,label:v}))} />
      <TS label="Ipogranulosi" value={data.ipogranulosi} onChange={v=>upd('ipogranulosi',v)} />
      <TS label="Ipergranulosi" value={data.ipergranulosi} onChange={v=>upd('ipergranulosi',v)} />
      <Sel label="Vacuolizzazione basale" value={data.vacuolizzazione_basale} onChange={v=>upd('vacuolizzazione_basale',v)} opts={['assente','presente','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Necrosi cheratinocitaria" value={data.necrosi_keratinociti} onChange={v=>upd('necrosi_keratinociti',v)} opts={['assente','presente','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Neutrofili" value={data.neutrofili} onChange={v=>upd('neutrofili',v)} opts={['assenti','rari','presenti','abbondanti'].map(v=>({value:v,label:v}))} />
      <TS label="Microascessi di Munro" value={data.microascessi_munro} onChange={v=>upd('microascessi_munro',v)} />
      <TS label="Corpi di Civatte" value={data.corpi_civatte} onChange={v=>upd('corpi_civatte',v)} />
      <Chk label="Saw-toothing" checked={data.saw_toothing} onChange={v=>upd('saw_toothing',v)} />
      <Chk label="Assottigliamento sovrapapillare" checked={data.assottigliamento_soprapapillare} onChange={v=>upd('assottigliamento_soprapapillare',v)} />
      <Chk label="Capillari dilatati nelle papille" checked={data.capillari_dilatati_papille} onChange={v=>upd('capillari_dilatati_papille',v)} />
    </div>
    <Nav onBack={onBack} onNext={onNext} />
  </div>
));

const Step3 = memo(({data,upd,onBack,onNext}) => (
  <div>
    <h2 className="text-2xl font-bold mb-4">3. Derma e infiltrato</h2>
    <div className="grid grid-2">
      <Sel label="Distribuzione infiltrato" value={data.infiltrato_distribuzione} onChange={v=>upd('infiltrato_distribuzione',v)} opts={[
        {value:'perivascolare_superficiale',label:'Perivascolare superficiale'},
        {value:'perivascolare_profondo',label:'Perivascolare profondo'},
        {value:'banda_lichenoide',label:'Banda lichenoide'},
        {value:'perianessiale',label:'Perianessiale'},
        {value:'interstiziale',label:'Interstiziale'}
      ]} />
      <Sel label="Densità infiltrato" value={data.infiltrato_densita} onChange={v=>upd('infiltrato_densita',v)} opts={['assente','lieve','moderata','marcata'].map(v=>({value:v,label:v}))} />
      <Sel label="Eosinofili" value={data.eosinofili} onChange={v=>upd('eosinofili',v)} opts={['assenti','rari','presenti','abbondanti'].map(v=>({value:v,label:v}))} />
      <Sel label="Plasmacellule" value={data.plasmacellule} onChange={v=>upd('plasmacellule',v)} opts={[
        {value:'assenti',label:'Assenti'},
        {value:'presenti',label:'Presenti: pensare anche a sifilide'},
        {value:'abbondanti',label:'Abbondanti: sifilide da escludere'}
      ]} />
      <Sel label="Linfociti atipici" value={data.linfociti_atipici} onChange={v=>upd('linfociti_atipici',v)} opts={['assenti','rari','presenti','abbondanti'].map(v=>({value:v,label:v}))} />
      <Sel label="Epidermotropismo" value={data.epidermotropismo} onChange={v=>upd('epidermotropismo',v)} opts={['assente','presente','marcato'].map(v=>({value:v,label:v}))} help="Scala coerente con il motore: assente/presente/marcato." />
      {['presente','marcato'].includes(data.epidermotropismo) && (
        <TS label="Spongiosi proporzionata all'epidermotropismo?" value={data.spongiosi_proporzionata} onChange={v=>upd('spongiosi_proporzionata',v)} help="Sì = dermatite più probabile; No = possibile MF se gli altri criteri reggono." />
      )}
      <TS label="Alone chiaro attorno ai linfociti epidermotropi" value={data.alone_chiaro} onChange={v=>upd('alone_chiaro',v)} />
    </div>
    <Nav onBack={onBack} onNext={onNext} />
  </div>
));

const Step4 = memo(({data,upd,onBack,onGen}) => (
  <div>
    <h2 className="text-2xl font-bold mb-4">4. Controlli finali</h2>
    <div className="space-y-4">
      <div className="grid grid-2">
        <Chk label="Necrosi cheratinocitaria diffusa" checked={data.necrosi_cheratinociti_diffusa} onChange={v=>upd('necrosi_cheratinociti_diffusa',v)} />
        <Chk label="Eritrociti intraepidermici" checked={data.eritrociti_extravasati_intraepidermici} onChange={v=>upd('eritrociti_extravasati_intraepidermici',v)} />
      </div>
      <div className="grid grid-2">
        <div>
          <label className="block font-semibold mb-2">Sede anatomica</label>
          <input type="text" value={data.sede_anatomica} placeholder="es. tronco, arto, cuoio capelluto..." onChange={e=>upd('sede_anatomica',e.target.value)} />
        </div>
        <TextArea label="Note cliniche" value={data.note_cliniche} onChange={v=>upd('note_cliniche',v)} placeholder="durata, recidiva, farmaci, lesioni multiple, distribuzione..." />
      </div>
    </div>
    <Nav onBack={onBack} onNext={onGen} nextLbl="🔬 Genera valutazione" />
  </div>
));

const App = () => {
  const {step,next,prev,reset:resetStep} = useForm(1);
  const {data,upd,reset:resetData} = useData();
  const [showRes,setShowRes] = useState(false);
  const [res,setRes] = useState({diagnoses:[],considered:[],allScores:[],flags:[],unsupportedPattern:false});

  const handleReset = useCallback(() => {
    if(confirm('Reset completo?')){
      resetData(); resetStep(); setShowRes(false);
    }
  },[resetData,resetStep]);

  const handleCalc = useCallback(() => {
    setRes(Engine.calc(data));
    setShowRes(true);
  },[data]);

  const renderStep = () => {
    switch(step){
      case 1: return <Step1 data={data} upd={upd} onNext={next} />;
      case 2: return <Step2 data={data} upd={upd} onBack={prev} onNext={next} />;
      case 3: return <Step3 data={data} upd={upd} onBack={prev} onNext={next} />;
      case 4: return <Step4 data={data} upd={upd} onBack={prev} onGen={handleCalc} />;
      default: return null;
    }
  };

  return (
    <div className="max-w-5xl">
      <div className="card">
        <div className="flex flex-mobile items-center justify-between">
          <div>
            <h1 className="text-3xl font-bold text-slate-800">🔬 DermPath v2.11.1</h1>
            <p className="text-sm text-slate-600 mt-1">Fix: soglia dati alzata (MIN_ANSWERED_WEIGHT 4→6, MIN_CRITERIA 2→3); spongiosi_proporzionata rimossa dai required di MF.</p>
          </div>
          <button onClick={handleReset} className="btn btn-slate mt-3">Reset</button>
        </div>
      </div>

      {!showRes && <Steps cur={step} />}

      {!showRes ? (
        <div className="card">{renderStep()}</div>
      ) : (
        <div className="card">
          <h2 className="text-2xl font-bold mb-4">Valutazione morfologica</h2>
          <FlagBox flags={res.flags} />

          {res.unsupportedPattern && (
            <div className="p-6 bg-slate-50 border-2 border-slate-300 rounded-xl mb-6 text-center">
              <p className="font-bold text-slate-700">Pattern riconosciuto, ma modulo diagnostico non ancora implementato.</p>
              <p className="text-sm text-slate-600 mt-2">Meglio nessuna diagnosi che una diagnosi generata per inerzia.</p>
            </div>
          )}

          {res.diagnoses.length > 0 ? (
            <div className="mb-6">
              <h3 className="text-xl font-bold mb-3">Diagnosi proponibili</h3>
              {res.diagnoses.map((dx,i) => <DxCard key={dx.key} dx={dx} idx={i} />)}
            </div>
          ) : (
            <div className="p-6 bg-slate-50 border-2 border-slate-300 rounded-xl mb-6 text-center">
              <p className="font-bold text-slate-700">Nessuna diagnosi proponibile con i dati inseriti.</p>
              <p className="text-sm text-slate-600 mt-2">Required mancanti o dati insufficienti (servono almeno 2 major o equivalente).</p>
            </div>
          )}

          {res.considered.length > 0 && (
            <div className="mb-6">
              <h3 className="text-xl font-bold mb-3">Diagnosi da considerare, non chiudibili</h3>
              {res.considered.map((dx,i) => <DxCard key={dx.key} dx={dx} idx={i} considered />)}
            </div>
          )}

          <div className="p-4 bg-blue-50 border-2 border-blue-200 rounded-xl mb-6">
            <h3 className="text-lg font-bold text-blue-800 mb-2">Nota interpretativa</h3>
            <p className="text-sm text-slate-700">La percentuale è una compatibilità euristica corretta per completezza, required mancanti, elementi contro e red flags. Non è una probabilità diagnostica.</p>
          </div>

          <button onClick={()=>setShowRes(false)} className="btn btn-slate">← Modifica dati</button>
        </div>
      )}
    </div>
  );
};

ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
